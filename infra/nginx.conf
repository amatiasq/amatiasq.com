server {
    listen 80;

    # TLS is terminated by nginx-proxy, so this server only ever sees http and
    # would redirect to it by name. Relative Location headers keep the scheme.
    absolute_redirect off;

    # A directory with no index.html was never built: 404, not the 403 nginx
    # gives by default, which also confirms the folder exists.
    error_page 403 =404 /404-not-built;

    # The site itself, built by `amq amatiasq.com deploy` into www/site/.
    # `index` (and no try_files) is what redirects /en/blog to /en/blog/, which
    # is what the build's `trailingSlash: 'always'` links to.
    location / {
        root /www/site;
        index index.html;
    }

    # Hashed filenames can never go stale; the HTML they are linked from can.
    location /_astro/ {
        root /www/site;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WORK
    # location /cv {
    #     return 301 /cv-en;
    # }
    location /cv-en {
        return 301 https://docs.google.com/document/d/1-OYtRQZ8rYQ8ipNY2rnNX4Nk_hlUn1LHRpIUW61v2Qw;
    }

    location /cv-es {
        return 301 https://docs.google.com/document/d/18jratWj56Wnc8yqsDn7KCKG7QwOex997iPOWZB92SNc;
    }

    location /mind-optimization {
        return 301 https://slides.amatiasq.com/mind-optimization/;
    }

    # BOOKS

    location /book/limites {
        default_type "text/html";
        alias /www/libros/el-arte-de-poner-limites.html;
    }

    # /meme/$a should show files in /www/memes/$a with the extension name found in the file system
    # /meme/sir should show /www/memes/sir.jpg
    # /meme/no should show /www/memes/no.jpeg
    # /meme/reydios should show /www/memes/reydios.png
    # /meme/pacha should show /www/memes/pacha.webp
    location ~ ^/meme/(?<name>[a-z]+)$ {
        root /www/memes;
        try_files /$name.jpg /$name.jpeg /$name.png /$name.webp /$name.gif =404;
    }

    # UTIL

    location = /template {
	default_type "text/html";
	alias /www/template.html;
    }

    location = /people {
	default_type "text/html";
	alias /www/people.html;
    }

    location = /matrix {
        default_type "text/html";
        alias /www/matrix.html;
    }

    location = /js {
        default_type "image/gif";
        alias /www/javascript.gif;
    }

    location = /deno.ts {
	default_type "application/typescript";
	alias /www/deno.ts;
    }

    location = /blank {
        default_type "text/html";
        alias /www/blank.html;
    }

    location = /speedback {
        default_type "text/html";
        alias /www/speedback.html;
    }

    location = /plot {
        default_type "video/mp4";
        alias /www/quaternaryplot.mp4;
    }

    location = /es/dnd-sheet {
        default_type "application/pdf";
        alias /www/dnd-sheet.pdf;
	add_header Access-Control-Allow-Origin "*";
	add_header Access-Control-Allow-Methods "GET";
    }

    location = /s {
        default_type "text/html";
        alias /www/secret.html;
    }

    location = /secret {
        # default_type "text/html";
        # alias /www/secret.html;
        proxy_pass https://gist.githubusercontent.com/amatiasq/772058eb19c9e188c1e3d1e526d24762/raw;
        proxy_hide_header Content-Type;
        add_header Content-Type text/html;
        # this header prevents inline-scripts and inline-styles for some reason
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "default-src https: 'unsafe-inline'; object-src 'none'";
    }

    location /install {
        return 301 https://raw.githubusercontent.com/amatiasq/bin/master/install/install.sh;
    }

    # LEGACY

    # `/deno` used to alias /repos/deno, but this container never mounted
    # /repos — it had been 404ing for as long as it existed. Removed with the
    # move of the demos into the site itself.

    location = /glib {
        return 301 /demos/glib/test/;
    }

    location /important {
        return 301 https://www.youtube.com/watch?v=dQw4w9WgXcQ;
    }

    location /slides/requirejs {
        return 301 https://slides.amatiasq.com/requirejs/;
    }

    location = /jordi {
        default_type image/jpeg;
        alias /www/regalo-jordi/imagen.jpeg;
        auth_basic "HOLA ZAPATO";
        auth_basic_user_file /www/regalo-jordi/.htaccess;
    }
}
