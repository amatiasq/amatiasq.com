<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      @keyframes loader {
        0% {
          top: 36px;
          left: 36px;
          width: 0;
          height: 0;
          opacity: 1;
        }
        100% {
          top: 0px;
          left: 0px;
          width: 72px;
          height: 72px;
          opacity: 0;
        }
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        background-color: black;
      }

      .loader {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .loader .container {
        display: inline-block;
        position: relative;
        width: 80px;
        height: 80px;
      }

      .loader .container .ripple {
        position: absolute;
        border: 4px solid #fff;
        opacity: 1;
        border-radius: 50%;
        animation: loader 1s cubic-bezier(0, 0.2, 0.8, 1) infinite;
      }

      .loader .container .ripple-2 {
        animation-delay: -0.5s;
      }
    </style>
  </head>
  <body>
    <div class="loader">
      <div class="container">
        <div class="ripple"></div>
        <div class="ripple ripple2"></div>
      </div>
    </div>
  </body>
</html>
